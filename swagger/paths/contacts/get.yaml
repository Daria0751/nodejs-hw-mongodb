tags:
  - Contacts
summary: Get contacts (paginated, sortable, filterable)
operationId: getContacts
security:
  - bearerAuth: []
parameters:
  - in: query
    name: page
    schema: { type: integer, default: 1 }
  - in: query
    name: perPage
    schema: { type: integer, default: 10 }
  - in: query
    name: sortBy
    schema: { type: string, default: name }
  - in: query
    name: sortOrder
    schema: { type: string, enum: [asc, desc], default: asc }
  - in: query
    name: type
    schema: { type: string, enum: [work, home, personal] }
  - in: query
    name: isFavourite
    schema: { type: boolean }
responses:
  '200':
    description: Successfully found contacts
    content:
      application/json:
        schema:
          type: object
          properties:
            status: { type: integer, example: 200 }
            message: { type: string, example: "Successfully found contacts!" }
            data:
              type: object
              properties:
                data:
                  type: array
                  items:
                    $ref: ../../components/schemas/Contact.yaml
                page:      { type: integer, example: 2 }
                perPage:   { type: integer, example: 4 }
                totalItems:{ type: integer, example: 6 }
                totalPages:{ type: integer, example: 2 }
                hasPreviousPage: { type: boolean, example: true }
                hasNextPage:     { type: boolean, example: false }
  '401':
    $ref: ../../components/responses/Unauthorized.yaml
